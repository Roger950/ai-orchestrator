[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "File-based, human-assisted multi-model orchestration"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
